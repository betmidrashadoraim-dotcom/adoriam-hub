function validateLead(p,old,workspace){
  const manager=workspace.user.role==="manager";
  must(p.alias.trim()&&p.alias.trim().length<=60&&PROJECT[p.project]&&PLAN.stages.includes(p.stage)&&PLAN.markets.includes(p.market));
  must([p.ask,p.pledged,p.received].every(v=>Number.isSafeInteger(v)&&v>=0&&v<=999999999));
  must(manager||p.owner===workspace.user.id,"forbidden");
  must(!p.country||/^[A-Z]{2}$/.test(p.country),"country");
  const money=["stage","project","market","country","ask","pledged","received","payDate","written"];
  must(manager||(p.received===(old?.received||0)&&(!old?.pledged||money.every(k=>p[k]===(old[k]??"")))),"finance");
  must(!old?.paidOnce||(p.project===old.project&&p.market===old.market&&p.country===(old.country||"")),"restricted");
  must((p.next.trim()&&p.due)||(["declined","referred","received"].includes(p.stage)&&!p.next.trim()&&!p.due),"next");
  if(["asked","pledged","received"].includes(p.stage)&&money.some(k=>p[k]!==old?.[k])){
    must(clearFor(workspace,p.project,p.market,p.country),"notReady");

}

    }else if(action==="project"){const old=db.projects.find(p=>p.id===obj.id);must(old&&old.rev===obj.rev,"conflict");validateProject(obj);Object.assign(old,obj,{rev:obj.rev+1})}

}

    $("#ask-gate").innerHTML=["asked","pledged","received"].includes(stage)&&!ready?note(esc(l(ERR.notReady)),"warm"):"";

  };
  f.addEventListener("change",e=>{if(e.target.name==="stage"&&v("stage")==="declined"){f.elements.next.value="";f.elements.due.value="";f.elements.help.checked=false}update()});update();
  formHandler(f,async()=>{
    const p={...a,alias:v("alias").trim(),circle:v("circle"),project:v("project"),market:v("market"),country:v("market")==="other"?v("country").trim().toUpperCase():"",owner:isManager()?Number(v("owner")):S.user.id,
      stage:v("stage"),ask:Number(v("ask")),pledged:Number(v("pledged")),received:Number(v("received")),payDate:v("payDate"),
      next:v("next").trim(),due:v("due"),help:f.elements.help.checked,written:f.elements.written.checked,meetingHeld:f.elements.meetingHeld.checked};
    if(!["pledged","received"].includes(p.stage)){
      must(!a.pledged&&!a.received||isManager(),"finance");

      Object.assign(p,{pledged:0,received:0,payDate:"",written:false});
    }
    validateLead(p,old,S);await change("lead",p);saved();
  });
}

  pledged:[1,"Confirm written terms and payment arrangements","לאשר תנאים בכתב וסידורי תשלום"],received:[2,"Send a personal thank-you and confirm the receipt","לשלוח תודה אישית ולוודא הנפקת קבלה"],

</script>
  <script>
"use strict";

views.projects=()=>`${titleBlock(t("Funding portfolio  /  02","תיק המיזמים  /  02"),l(NAV.projects),t("Five community projects totaling ₪1,000,000. Open any brief to see what the gift supports and what still needs approval.","חמישה מיזמים קהילתיים בסך כולל של ₪1,000,000. בכרטיס המיזם אפשר לראות מה התרומה מקדמת ומה עדיין טעון אישור."),act("brief",t("Print bilingual brief","הדפסת תקציר דו־לשוני"),{icon:"print"}))}
  ${note(esc(l(STATUS_NOTE)),"warm")}<div class="grid-2 top-gap">${S.projects.map(projectCard).join("")}</div>

actions["project-view"]=id=>{

  modal(l(d.name),`<div class="stack"><div class="between"><strong class="display">${money(p.goal)}</strong>${badge(projectReady(p),p.approved?"green":"amber")}</div><p>${esc(p.scope||l(d.outcome))}</p>
    ${note(esc(l(d.proof)),"warm")}<div class="grid-2"><div><span class="subtle-label">${t("Delivery owner","אחריות לביצוע")}</span><strong>${esc(p.owner||t("Not assigned","טרם נקבעה"))}</strong></div><div><span class="subtle-label">${t("Timing","לוח זמנים")}</span><strong>${esc(p.schedule||t("Not confirmed","טרם אושר"))}</strong></div></div>
    <div><h3>${t("If approvals are delayed","אם האישורים מתעכבים")}</h3><p>${esc(p.fallback||t("Do not start unapproved work or redirect a restricted gift. Confirm revised terms with the receiving organization and donor.","לא מתחילים עבודה שלא אושרה ולא משנים ייעוד תרומה. מבררים תנאים מעודכנים עם הגוף המקבל ועם התורם."))}</p></div>
    <div><div class="between"><strong>${t("Cash progress","התקדמות בתקבולים")}</strong><span>${money(st.received)} / ${money(p.goal)}</span></div><progress class="spaced" value="${Math.min(st.received,p.goal)}" max="${p.goal}" aria-label="${t("Cash progress","התקדמות בתקבולים")}"></progress></div>

    <div class="actions">${isManager()?act("project-edit",t("Edit budget & readiness","עריכת תקציב ומוכנות"),{id,cls:"primary",icon:"pen"}):""}${act("giving-info",t("View giving routes","הצגת מסלולי תרומה"),{id,icon:"globe"})}${act("project-print",t("Print project sheet","הדפסת דף מיזם"),{id,icon:"print"})}</div></div>`,t("Project brief","כרטיס מיזם"));
};
actions["project-edit"]=id=>{
  must(isManager(),"forbidden");const p=clone(S.projects.find(x=>x.id===id));
  modal(l(PROJECT[id].name),`<form id="project-form">${note(t("Use public-safe summaries in either language; your wording appears as entered. Store permits, quotations and sensitive documents with the responsible organization, not in this hub.","יש להשתמש בסיכומים המתאימים לפרסום. הטקסט יוצג בשפה שבה נכתב. היתרים, הצעות מחיר ומסמכים רגישים שומרים אצל הגוף האחראי ולא במרכז זה."))}
    <div class="form-grid">${field(t("Project budget · ₪","תקציב המיזם · ₪"),input("goal",p.goal,'type="number" step="1" min="1" max="999999999" required'))}${field(t("Project lead","אחראי/ת המיזם"),input("owner",p.owner,'maxlength="100"'))}
    ${field(t("Milestones and timing","אבני דרך ולוח זמנים"),input("schedule",p.schedule,'maxlength="160"'),"",true)}${field(t("Public scope and measurable outcome","היקף לפרסום ותוצאה מדידה"),area("scope",p.scope,600),"",true)}
    ${field(t("Delay and contingency plan","תוכנית לעיכובים ולבלתי צפוי"),area("fallback",p.fallback,400),"",true)}
    ${field(t("Budget lines · amount | description","סעיפי תקציב · סכום | תיאור"),area("lines",(p.lines||[]).map(r=>`${r.amount} | ${r.label}`).join("\n"),2000),t("One item per line. Example format: 5000 | Design review. Use actual estimates; the total must match your budget before clearance.","סעיף אחד בכל שורה. לדוגמה: 5000 | בדיקת תכנון. השתמשו באומדנים בפועל. הסכום הכולל חייב להתאים לתקציב לפני אישור המיזם."),true)}</div>
    <div class="checklist">${PLAN.projectChecks.map(k=>check("check-"+k,l(PCHECK[k]),p.checks.includes(k))).join("")}</div>
    <div class="note">${check("approved",t("The team has reviewed the evidence and cleared this scope for fundraising. This is not a legal permit.","הצוות בדק את התיעוד ואישר גיוס למטרה זו. אין מדובר בהיתר חוקי."),p.approved)}</div>${savebar()}</form>`,t("Manager · project readiness","ניהול · מוכנות מיזם"));
  formHandler($("#project-form"),async data=>{const out={...p,goal:Number(data.get("goal")),checks:PLAN.projectChecks.filter(k=>data.has("check-"+k)),approved:data.has("approved")};for(const k of ["owner","schedule","scope","fallback"])out[k]=data.get(k).trim();
    out.lines=data.get("lines").split(/\r?\n/).filter(s=>s.trim()).map(s=>{const match=s.match(/^\s*(\d+)\s*\|\s*(.+?)\s*$/);must(match,"budgetLines");return {amount:Number(match[1]),label:match[2]}});
    validateProject(out);await change("project",out);saved()});
};
actions["project-print"]=id=>{
  const p=S.projects.find(x=>x.id===id);must(p,"missing");
  printContent(`<article class="brief-page" dir="${t("ltr","rtl")}">${practice&&!STANDALONE?`<p class="practice-print">${t("PRACTICE COPY · illustrative only","עותק תרגול · להמחשה בלבד")}</p>`:""}${eyebrow(t("Adorim · project sheet","אדורים · דף מיזם"))}<h1>${esc(l(PROJECT[id].name))}</h1><p>${esc(projectReady(p))} · ${money(p.goal)} · ${esc(fmtDay(localDay()))}</p><p>${esc(p.scope||l(PROJECT[id].outcome))}</p><h2>${t("Itemized budget","תקציב מפורט")}</h2>${budgetTable(p)}<p>${t("Owner and timing:","אחריות ולוח זמנים:")} ${esc(p.owner||"—")} · ${esc(p.schedule||"—")}</p><h2>${t("Permissions & contingency","אישורים ועתודה")}</h2><p>${esc(l(STATUS_NOTE))}</p><p>${esc(p.fallback||t("A delay plan has not yet been confirmed.","תוכנית לעיכובים טרם אושרה."))}</p><p>${t("Please ask the resident who shared this sheet for the verified receiving channel. Never transfer funds to a personal account.","לבירור הגוף המקבל והמסלול המאומת פנו לתושב ששיתף דף זה. אין להעביר כסף לחשבון פרטי.")}</p></article>`);
};

    ${eyebrow(t("Adorim Community Fund  /  Donor brief","הקרן הקהילתית של אדורים  /  תקציר לתורם"))}<h1>${t("Adorim: a place to grow","אדורים: מקום לצמוח בו")}</h1>
    <p>${t("Residents are volunteering their time to develop spaces for young people, support local livelihoods and improve everyday safety. We invite a conversation about one project you care about.","תושבים מקדישים מזמנם בהתנדבות לפיתוח מרחבים לצעירים, לחיזוק הפרנסה המקומית ולשיפור הבטיחות היומיומית. נשמח לשוחח על מיזם אחד שקרוב לליבכם.")}</p>
    <p><strong>${t("Current status","המצב כיום")}:</strong> ${esc(l(STATUS_NOTE))}</p><h2>${t("What a gift could support","מה תרומה יכולה לקדם")}</h2>
    ${S.projects.map(p=>`<div class="print-block"><h3>${esc(l(PROJECT[p.id].name))} · ${money(p.goal)}</h3><p>${esc(l(PROJECT[p.id].intro))} <em>${esc(projectReady(p))}.</em></p></div>`).join("")}
    <p><strong>${t("Combined planning total","סך התקציב המתוכנן")}: ${money(goal())}</strong></p><h2>${t("A responsible next step","הצעד הבא, באחריות")}</h2>
    <p>${t("Ask the resident who shared this brief for a 20-minute introduction to the campaign lead. Before any gift, request the approved scope, itemized budget, receiving entity, written terms and the receipt rules for your country.","אפשר לבקש מהתושב ששיתף את התקציר לתאם היכרות בת 20 דקות עם מוביל הגיוס. לפני תרומה בקשו את היקף המיזם שאושר, פירוט התקציב, שם הגוף המקבל, תנאים בכתב וכללי קבלות למדינתכם.")}</p>

  finally{lang=original}
}

const PHASES=[
  [["Weeks 1–2 · Make it possible","שבועות 1–2 · מכינים תשתית"],[
    ["Hold a 90-minute workshop with 8–12 volunteers. Choose a lead, coordinator, finance contact and project owners; invite captains to support groups of 5–8 households.","קיימו סדנה בת 90 דקות ל־8–12 מתנדבים. בחרו מוביל, רכז, אחראי כספים ואחראי מיזמים. רצוי שכל ראש קבוצה ילווה 5–8 משקי בית."],
    ["Review budgets and two quotes per project. Confirm planning status, approvals, restrictions and the fallback if a project is delayed.","בדקו תקציבים ושתי הצעות מחיר לכל מיזם. בררו מצב תכנוני, אישורים, מגבלות ומה עושים במקרה של עיכוב."],
    ["Verify a receiving route, create the bilingual case and identify 30 possible relationships privately. Do not collect money into personal accounts.","אמתו מסלול לקבלת תרומות, הכינו תקציר דו־לשוני ומפו באופן פרטי 30 קשרים אפשריים. אין לגבות כספים לחשבונות פרטיים."]]],
  [["Week 3 · Train & target","שבוע 3 · מכשירים וממקדים"],[
    ["In one 45-minute session, practice an opening, an ask and a respectful no. Each household privately considers five people, then selects the best three.","במפגש אחד בן 45 דקות תרגלו פתיחה, בקשה וקבלת סירוב בכבוד. כל משק בית יחשוב בפרטיות על חמישה אנשים ויבחר שלושה מתאימים."],
    ["Score relationship strength, interest, likely fit and the best introducer. One resident owns each relationship; privately coordinate overlaps with the captain.","שקלו את חוזק הקשר, תחומי העניין, מידת ההתאמה ומי יכול לחבר. לכל קשר אחראי אחד; תיאום חפיפות נעשה בפרטיות מול הרכז."],
    ["Aim to book ten meetings in three weeks. An introduction is a useful outcome, not a promise of a gift.","שאפו לקבוע עשר פגישות בשלושה שבועות. חיבור אישי הוא תוצאה מועילה, לא הבטחה לתרומה."]]],
  [["Weeks 4–5 · Open conversations","שבועות 4–5 · פותחים שיחות"],[
    ["Start with the strongest 15 relationships. Ask for 20 minutes, not money in a mass WhatsApp. For a second-circle lead, ask permission for a forwardable introduction.","התחילו ב־15 הקשרים החזקים. בקשו 20 דקות לשיחה ולא כסף בהודעת תפוצה. במעגל שני בקשו רשות להעביר הודעת היכרות."],
    ["Before each meeting agree on one project, an exact ask, who tells the personal story, who answers budget questions and the next step.","לפני כל פגישה בחרו מיזם, סכום מדויק, מי יספר את הסיפור האישי, מי ישיב על שאלות התקציב ומה הצעד הבא."]]],
  [["Weeks 6–7 · Ask & close","שבועות 6–7 · מבקשים וסוגרים"],[
    ["Only make a formal ask once the project and giving route are cleared. Ask for a specific sum, then listen. Offer a smaller gift, a future conversation or an introduction without pressure.","בקשה רשמית מגישים רק לאחר אישור המיזם ומסלול התרומה. מבקשים סכום מוגדר ומקשיבים. אפשר להציע סכום קטן יותר, שיחה עתידית או חיבור, ללא לחץ."],
    ["The team sends a written summary within 24 hours: use of funds, terms, payment date, verified giving channel, receipt position and next update. Keep pledges separate from cash.","הצוות שולח סיכום בכתב בתוך 24 שעות: ייעוד, תנאים, תאריך תשלום, מסלול מאומת, תנאי קבלה ועדכון הבא. מפרידים בין התחייבות לכסף שהתקבל."],
    ["Seek a matching pledge if helpful. Confirm its cap, dates and conditions in writing; never count a match twice.","אפשר לבקש התחייבות להכפלת תרומות. מתעדים תקרה, מועדים ותנאים ולא סופרים תרומה כפולה."]]],
  [["Week 8 · Thank, report & decide","שבוע 8 · מודים, מדווחים ומחליטים"],[
    ["The resident thanks the donor personally within 48 hours; finance arranges the proper receipt. Revisit undecided prospects once at an agreed time.","התושב מודה אישית בתוך 48 שעות והגזברות מטפלת בקבלה המתאימה. חוזרים למתלבטים פעם אחת במועד שהוסכם."],
    ["Review meeting, ask, pledge, receipt and referral counts. Choose whether to extend, resize the first phase or pause. Never rank households publicly.","בדקו פגישות, בקשות, התחייבויות, תקבולים וחיבורים. החליטו אם להאריך, לשנות את היקף השלב הראשון או לעצור. אין לדרג משפחות בפומבי."],
    ["Send quarterly spending and milestone updates, and a completion report. Get written consent before changing a restricted use, publishing names or using photos.","שולחים עדכון רבעוני על הוצאות ואבני דרך ודוח סיום. שינוי ייעוד או פרסום שמות ותמונות מחייבים הסכמה בכתב."]]]
];
let bookTab="sprint";
const bookTabs={sprint:["Eight-week sprint","מהלך לשמונה שבועות"],roles:["People & meetings","אנשים ופגישות"],strategy:["Funding strategy","אסטרטגיית הגיוס"]};
function tabset(options,chosen,action){return `<div class="tabs">${Object.keys(options).map(k=>`<button type="button" data-act="${action}" data-id="${k}" aria-pressed="${chosen===k}">${esc(l(options[k]))}</button>`).join("")}</div>`}
function bookContent(){
  if(bookTab==="sprint")return `<div class="stack">${PHASES.map(([head,items],i)=>sheet(l(head),listHTML(items.map(l)),"0"+(i+1),i===0)).join("")}</div>`;
  if(bookTab==="roles")return `<div class="grid-2"><div class="panel sage"><h2>${t("What only a resident can do","מה שרק התושב יכול לעשות")}</h2>${listHTML([
    t("Connector: make three permission-based introductions.","מחבר/ת: שלושה חיבורים בהסכמה."),t("Advocate: tell your personal story in two meetings.","שגריר/ה: לספר את הסיפור האישי בשתי פגישות."),
    t("Ask partner: make one well-prepared major-gift request.","שותף/ה לבקשה: בקשת תרומה משמעותית אחת לאחר הכנה."),t("Ambassador: invite five smaller community gifts.","נציג/ת קהילה: לפנות לחמש תרומות קהילתיות קטנות יותר."),
    t("Send a personal thank-you. Count introductions as useful work, not only money.","שלחו תודה אישית. חיבורים נחשבים לתרומה למאמץ, גם כשלא התקבל כסף.")])}</div>
    <div class="panel"><h2>${t("What stays central","מה נשאר באחריות הצוות")}</h2>${listHTML([t("Campaign lead: choose priorities, join major meetings, decide and support volunteers.","מוביל הגיוס: סדרי עדיפויות, פגישות גדולות, החלטות וסיוע למתנדבים."),
    t("Coordinator and captains: schedule meetings, discreetly prevent duplicate approaches and clear overdue actions.","הרכז וראשי הקבוצות: תיאום פגישות, מניעת כפילות בדיסקרטיות וטיפול במשימות באיחור."),
    t("Finance and project owners: budgets, agreements, suppliers, receipt questions and donor reporting.","הגזברות ואחראי המיזמים: תקציבים, הסכמים, ספקים, קבלות ודיווח לתורמים."),
    t("Local and overseas co-chairs open doors. Professional advisers check planning, legal, tax and safety issues.","יושבי ראש מקומיים ובחו״ל פותחים דלתות. אנשי מקצוע בודקים תכנון, משפט, מס ובטיחות.")])}</div></div>
    <div class="stack top-gap">${sheet(t("A 20-minute donor conversation","שיחת תורם ב־20 דקות"),listHTML([t("3 min · Personal connection. Why this matters to your family.","3 דקות · קשר אישי. מדוע העניין חשוב למשפחה שלכם."),t("4 min · Listen and connect the need to their interests.","4 דקות · הקשבה וחיבור הצורך לתחומי העניין שלהם."),t("5 min · One project, its budget, permissions and outcome.","5 דקות · מיזם אחד, תקציב, אישורים ותוצאה."),t("5 min · Questions. Say “I’ll check” when you do not know.","5 דקות · שאלות. כשלא יודעים אומרים ״אבדוק״."),t("1 min · A specific, appropriate ask. Then listen.","דקה · בקשה מתאימה ומוגדרת. ואז מקשיבים."),t("2 min · Agree a next step, an owner and a date.","2 דקות · קובעים צעד, אחראי ותאריך.")]),"",true)}
    ${sheet(t("A volunteer-friendly weekly check-in","בדיקה שבועית שמתאימה למתנדבים"),`<p>${t("Keep it to 20–30 minutes. Review aggregate counts, help requests, obstacles and the next three decisions. No roll call of donors, no household league table. Let residents submit updates asynchronously.","הגבילו ל־20–30 דקות. עברו על מספרים מצטברים, בקשות עזרה, חסמים ושלוש החלטות קרובות. אין מקריאים שמות תורמים ואין טבלת דירוג למשפחות. אפשר לעדכן גם בלי להשתתף בישיבה.")}</p>`)}</div>`;
  return `<div class="split equal"><article class="panel"><h2>${t("Israel: trust first","ישראל: מתחילים באמון")}</h2><p>${t("Start with relatives, former residents, local businesses, suppliers, entrepreneurs and family foundations. Ask a mutual contact for a meeting. Value in-kind offers separately and accept them only against approved needs.","התחילו בקרובים, תושבים לשעבר, עסקים, ספקים, יזמים וקרנות משפחתיות. בקשו פגישה באמצעות מכר משותף. מעריכים תרומה בעין בנפרד ומקבלים אותה רק לצורך שאושר.")}</p></article>
    <article class="panel sage"><h2>${t("Overseas: go narrow","חו״ל: מתחילים ממוקד")}</h2><p>${t("Choose one or two regions with real relationships. Approach families, synagogues, congregations, donor-advised fund holders and family foundations through personal introductions. Prepare an English brief and confirm the exact receiving and receipt route for that jurisdiction.","בחרו אזור אחד או שניים עם קשרים אמיתיים. פנו דרך היכרות למשפחות, בתי כנסת, קהילות, בעלי קרנות מונחות־תורם וקרנות משפחתיות. הכינו תקציר באנגלית ובדקו מי מקבל את הכסף ומהם תנאי הקבלה במדינה.")}</p></article></div>
    ${section(t("Feasibility test · illustrative, not commitments","בדיקת היתכנות · להמחשה בלבד"),t("One way to reach ₪1,000,000","דרך אפשרית לגייס ₪1,000,000"))}
    <div class="panel"><div class="table-wrap"><table><thead><tr>${[t("Level","דרגה"),t("Gifts","מספר תרומות"),t("Ask","סכום לפנייה"),t("Subtotal","סך ביניים")].map(x=>`<th>${esc(x)}</th>`).join("")}</tr></thead><tbody>${[[t("Founding","מייסדים"),4,75000],[t("Lead","מובילים"),10,30000],[t("Major","משמעותיים"),25,10000],[t("Community","קהילה"),75,2000]].map(([n,k,v])=>`<tr><td>${esc(n)}</td><td>${k}</td><td>${money(v)}</td><td>${money(v*k)}</td></tr>`).join("")}</tbody></table></div>
    <p class="muted top-gap">${t("An alternative: 25 × ₪20,000, 10 × ₪35,000 and 75 × ₪2,000. These are models, not forecasts. An opportunity is not a secured gift: map more prospects than gifts needed and resize the plan based on actual responses.","חלופה: 25 תרומות של ₪20,000, עשר של ₪35,000 ושבעים וחמש של ₪2,000. אלה מודלים ולא תחזיות. הזדמנות אינה תרומה מובטחת: מפים יותר קשרים ממספר התרומות הדרוש ומתאימים את התוכנית לתגובות בפועל.")}</p></div>
    <div class="panel top-gap"><h2>${t("After the resident pilot","אחרי המהלך הקהילתי")}</h2><p>${t("The larger planning horizon is 6–9 months. Use a quiet phase to test up to 75 warm prospects; consider a public launch only after 50–60% is credibly committed. Then consider a local gathering, two overseas briefings and a final 30-day challenge. Publish monthly progress and steward donors quarterly.","אופק התכנון הכולל הוא 6–9 חודשים. בשלב שקט בוחנים עד 75 קשרים חמים; שוקלים השקה פומבית רק לאחר התחייבויות מבוססות ל־50%–60% מהיעד. בהמשך אפשר לקיים מפגש מקומי, שני תדרוכים בחו״ל ומאמץ סיום בן 30 יום. מפרסמים התקדמות חודשית ומעדכנים תורמים מדי רבעון.")}</p></div>`;
}
views.playbook=()=>`${titleBlock(t("Field guide  /  03","מדריך למגייסים  /  03"),l(NAV.playbook),t("A small mission for each household, with the difficult administrative work carried by the team.","משימה קטנה לכל משפחה, כשהעבודה המנהלית המורכבת נשארת בידי הצוות."))}${tabset(bookTabs,bookTab,"book-tab")}${bookContent()}`;
actions["book-tab"]=id=>{bookTab=id;render()};

const scripts={open:["First-circle opening","פתיחה למעגל ראשון"],intro:["Second-circle introduction","חיבור למעגל שני"],ask:["Specific gift request","בקשה לסכום מוגדר"],close:["24-hour summary","סיכום בתוך 24 שעות"],thanks:["Personal thank-you","תודה אישית"],no:["After a decline","לאחר סירוב"],update:["Quarterly update","עדכון רבעוני"]};
let kit={type:"open",project:"youth",ask:25000};
function scriptText(config=kit){
  const p=projectName(config.project),sum=ils(config.ask||0);
  return ({
    open:t(`Hi [name], I’m volunteering with neighbors in Adorim on a project close to my heart: ${p}. I thought of you because [personal reason]. Would you have 20 minutes this week to hear what we’re planning?`,
      `שלום [שם], אני מתנדב/ת עם שכנים מאדורים למען מיזם שקרוב לליבי: ${p}. חשבתי דווקא עליך כי [סיבה אישית]. נוכל לדבר השבוע במשך 20 דקות על מה שאנחנו מתכננים?`),
    intro:t(`Would you feel comfortable forwarding this note to one person who cares about ${p}? Please check with them before sharing any contact details.\n\n“Someone I know in Adorim is volunteering on ${p}. Would you like a short introduction? No pressure at all.”`,
      `יהיה לך נוח להעביר הודעה לאדם אחד שחשוב לו הנושא של ${p}? חשוב לקבל רשות לפני שמשתפים פרטי קשר.\n\n״מישהו שאני מכיר/ה מאדורים מתנדב בנושא ${p}. יתאים לך שאחבר ביניכם לשיחה קצרה? בלי שום התחייבות.״`),
    ask:t(`You mentioned that [their priority] matters to you. Would you consider a gift of ${sum} toward ${p}, specifically for [approved milestone]? We can share the written budget and verified giving route. What would you like to understand before deciding?`,
      `אמרת ש[נושא שחשוב לתורם] קרוב לליבך. האם תשקול/י תרומה של ${sum} עבור ${p}, לטובת [אבן דרך שאושרה]? נוכל להעביר תקציב כתוב ומסלול תרומה מאומת. מה חשוב לך לברר לפני החלטה?`),
    close:t(`Thank you for discussing ${p}. My understanding is [agreed amount and restricted use]. The receiving organization is [verified entity]. The agreed payment date is [date]. Attached are its giving instructions and receipt terms for your jurisdiction. [Owner] will update you on [date]. Please confirm or correct this summary.`,
      `תודה על השיחה על ${p}. להבנתי סוכם על [סכום וייעוד מוסכמים]. הגוף המקבל הוא [גוף מאומת]. מועד התשלום המוסכם הוא [תאריך]. מצורפים פרטי המסלול המאומת ותנאי הקבלה למדינתך. [אחראי/ת] יעדכן ב[מועד]. נשמח לאישור או לתיקון הסיכום.`),
    thanks:t(`Thank you for your support for ${p}. It means a great deal to me that you took the time to listen and help. The team will follow up about the receipt and update you by [agreed date]. May we stay in touch in the way you prefer?`,
      `תודה על התמיכה ב${p}. משמעותי עבורי שפינית זמן להקשיב ולעזור. הצוות יטפל בנושא הקבלה ויעדכן עד [מועד מוסכם]. נשמח לשמור על קשר בדרך שנוחה לך.`),
    no:t("Thank you for hearing me out. I respect your decision and won’t follow up on this request. If you ever want an update, you’re welcome to reach out.","תודה על ההקשבה. אני מכבד/ת את ההחלטה ולא אחזור אליך בעניין הבקשה הזאת. אם תרצה/י עדכון בעתיד, אשמח לשמוע."),
    update:t(`Here is your update on ${p}: [milestone actually achieved], [cash received and spent], and [remaining work or delay]. The next update is due [date]. If the scope needs to change, we will discuss the written terms with you before reallocating restricted funds.`,
      `הנה עדכון על ${p}: [אבן דרך שהושלמה בפועל], [כסף שהתקבל והוצא] ו[עבודה שנותרה או עיכוב]. העדכון הבא יישלח עד [תאריך]. אם נדרש שינוי בהיקף, נברר איתך את התנאים בכתב לפני שינוי ייעוד של תרומה.`)
  })[config.type];
}
function faq(){return `<div class="stack">${[
  [t("Can we promise a build date or naming rights?","אפשר להבטיח מועד בנייה או הנצחה?"),l(STATUS_NOTE)+" "+t("Naming needs confirmed ownership, permissions and a recognition policy.","הנצחה מחייבת בעלות מוסדרת, הרשאות ומדיניות הוקרה.")],
  [t("How do overseas receipts work?","איך פועלות קבלות בחו״ל?"),t("Only the authorized receiving entity can confirm eligibility. Check the donor’s jurisdiction and gift type, including donor-advised funds. Never promise deductibility, use an informal pass-through or treat a pledge as a receipt.","רק הגוף המקבל המורשה יכול לאשר זכאות. בדקו מדינה וסוג תרומה, כולל קרנות מונחות־תורם. אין להבטיח זיכוי מס, להשתמש במתווך לא מוסדר או להציג התחייבות כקבלה.")],
  [t("What can we share?","מה אפשר לשתף?"),t("Share the bilingual donor brief. Do not share the team pipeline, private contact lists or sensitive safety information. Use stories, photos and public donor names only with permission.","שתפו את התקציר הדו־לשוני. אין לשתף רשימות פניות, פרטי קשר או מידע בטיחותי רגיש. סיפורים, תמונות ושמות תורמים מפרסמים רק בהסכמה.")],
  [t("What if they prefer to help in another way?","מה אם מעדיפים לעזור בדרך אחרת?"),t("Thank them. If invited, discuss a different amount, future gift, introduction, approved in-kind support or a documented match. Do not push for a referral after a clear no.","מודים להם. אם מתאים להם, אפשר לדבר על סכום אחר, תרומה עתידית, חיבור, תרומה בעין שאושרה או הכפלה מתועדת. אחרי סירוב ברור לא לוחצים לקבל הפניה.")]
].map(([q,a])=>sheet(q,`<p>${esc(a)}</p>`)).join("")}</div>`}
views.toolkit=()=>`${titleBlock(t("Field guide  /  04","מדריך למגייסים  /  04"),l(NAV.toolkit),t("Words you can make your own. Choose a situation, personalize the brackets and reach out privately. Nothing is sent by this site.","נוסחים שאפשר להפוך לאישיים. בחרו מצב, התאימו את הטקסט בסוגריים ופנו באופן פרטי. האתר אינו שולח הודעות."),act("brief",t("Bilingual donor brief","תקציר דו־לשוני לתורם"),{icon:"print"}))}
  <div class="panel"><div class="toolbar" id="kit-controls">${field(t("Conversation","סוג שיחה"),select("type",opts(Object.keys(scripts),k=>l(scripts[k]),kit.type)))}${field(t("Project","מיזם"),select("project",opts(S.projects.map(p=>p.id),projectName,kit.project)))}${field(t("Ask amount · ₪","סכום לבקשה · ₪"),input("ask",kit.ask,'type="number" min="1" max="999999999" step="1"'))}</div>
  ${note(t("Use the ask and payment summary only after clearance. Replace every bracket with confirmed information. No tax promises or personal transfers.","בקשה וסיכום לתשלום מתאימים רק לאחר אישור. יש להחליף את כל הסוגריים במידע בדוק. ללא הבטחת זיכוי מס או העברה לחשבון פרטי."),"warm")}
  <blockquote class="quote-box" id="script-result">${esc(scriptText())}</blockquote><div class="actions">${act("copy-script",t("Copy this script","העתקת הנוסח"),{cls:"primary",icon:"copy"})}</div></div>
  ${section(t("Before promising anything","לפני שמבטיחים דבר"),t("Donor questions","שאלות של תורמים"))}${faq()}`;
document.addEventListener("input",e=>{if(e.target.closest("#kit-controls")){const k=e.target.name;kit[k]=k==="ask"?Number(e.target.value):e.target.value;$("#script-result").textContent=scriptText()}});
actions["copy-script"]=()=>{if(kit.type==="ask")must(Number.isSafeInteger(kit.ask)&&kit.ask>0&&kit.ask<=999999999,"askAmount");return copyText(scriptText())};

</script>
  <script>
"use strict";
let teamTab="pipeline",teamFilter={owner:"",stage:"",q:"",attention:""};
const teamTabs={pipeline:["Pipeline & handoffs","פניות והעברות לטיפול"],ready:["Readiness & giving","מוכנות ומסלולי תרומה"],people:["People & access","אנשים והרשאות"],report:["Reports","דוחות"]};
const ownerName=id=>S.members.find(m=>m.id===id)?.name||"—";
const activityName={lead:["Opportunity updated","הזדמנות עודכנה"],removed:["Opportunity removed","הזדמנות נמחקה"],project:["Project reviewed","מיזם עודכן"],campaign:["Campaign settings updated","הגדרות הגיוס עודכנו"],invited:["Invitation issued","הונפקה הזמנה"],joined:["Resident joined","הצטרף תושב"],access:["Access changed","הרשאה שונתה"],task:["Team task updated","משימת צוות עודכנה"],taskDone:["Team task completed","משימת צוות הושלמה"]};
function sprintTiming(){
  const start=S.campaign.start;if(!start)return t("No start date set","לא נקבע תאריך התחלה");
  const days=(Date.parse(localDay()+"T12:00:00Z")-Date.parse(start+"T12:00:00Z"))/86400000;
  return days<0?t("Starts ","מתחיל ב־")+fmtDay(start):days>=56?t("Eight-week review due","הגיע הזמן לסיכום שמונת השבועות"):t("Sprint week ","שבוע במהלך: ")+(1+Math.floor(days/7))+" / 8";
}
function pipelineTable(){
  const list=S.leads.filter(a=>(!teamFilter.owner||a.owner===Number(teamFilter.owner))&&(!teamFilter.stage||a.stage===teamFilter.stage)&&a.alias.toLowerCase().includes(teamFilter.q.trim().toLowerCase())&&
    (!teamFilter.attention||(teamFilter.attention==="help"?a.help:!!(a.next&&a.due&&a.due<=localDay(7)&&a.stage!=="declined"))));
  return list.length?`<div class="result-count">${t("Records in view","רשומות בתצוגה")}: ${list.length}</div><div class="table-wrap"><table><thead><tr>${[t("Alias / owner","כינוי / אחראי"),t("Project / stage","מיזם / שלב"),t("Planned ask","בקשה מתוכננת"),t("Next step","צעד הבא"),t("Actions","פעולות")].map(v=>`<th scope="col">${esc(v)}</th>`).join("")}</tr></thead><tbody>${list.map(a=>`<tr><td><strong><bdi>${esc(a.alias)}</bdi></strong><br>${esc(ownerName(a.owner))}</td><td>${esc(projectName(a.project))}<br>${badge(l(STAGE[a.stage]))}</td><td>${money(a.ask)}</td><td>${esc(a.next||"—")}<br><small>${esc(a.due?dueLabel(a):"—")}</small></td><td><div class="actions">${mini("lead-edit",t("Open opportunity","פתיחת הזדמנות")+" "+a.alias,"arrow",a.id)}${a.stage!=="declined"?act("track-followup",a.help?t("View task","הצגת המשימה"):t("Send to board","העברה ללוח"),{id:a.id,cls:"small",icon:"board"}):""}</div></td></tr>`).join("")}</tbody></table></div>`:empty(t("No matching opportunities","אין הזדמנויות מתאימות"),t("Adjust the filters or add the first opportunity with its relationship owner.","שנו מסננים או הוסיפו הזדמנות ראשונה בצירוף אחראי הקשר."));
}
function pipelinePanel(){
  const help=S.leads.filter(a=>a.help),soon=upcoming(S.leads).filter(a=>a.due<=localDay(7));
  return `<div class="split equal"><article class="panel tinted">${eyebrow(t("Coordinator queue","תור הרכז"))}<h2>${t("Team help requested","ממתינים לסיוע הצוות")} · ${help.length}</h2>${help.length?actionRows(help,5):`<p>${t("No open handoffs. Residents can ask for help on any opportunity.","אין בקשות פתוחות. תושבים יכולים לבקש עזרה בכל הזדמנות.")}</p>`}</article>
  <article class="panel"><div class="section-head"><div>${eyebrow(t("This week","השבוע"))}<h2>${t("Due or overdue","קרוב או באיחור")} · ${soon.length}</h2></div>${icon("clock")}</div>${soon.length?actionRows(soon,5):`<p>${t("Nothing due in the next seven days.","אין פעולות הממתינות בשבעת הימים הקרובים.")}</p>`}</article></div>
  ${section(t("Private team view","תצוגה פרטית לצוות"),t("Relationship pipeline","מעקב אחר קשרים"),act("lead-new",t("Add opportunity","הוספת הזדמנות"),{cls:"primary small",icon:"plus"}))}
  <div class="panel">${note(t("Use aliases to coordinate privately. Check possible overlaps with captains before anyone approaches the same donor; matching aliases alone cannot identify duplicates.","השתמשו בכינויים לתיאום פרטי. בררו חפיפות עם ראשי הקבוצות לפני פנייה לאותו תורם; כינויים לבדם אינם מספיקים לזיהוי כפילויות."))}

function circleCandidates(){

}

function icsEscape(s){return String(s||"").replace(/\\/g,"\\\\").replace(/\r?\n/g,"\\n").replace(/;/g,"\\;").replace(/,/g,"\\,")}
function downloadICS({uid,summary,description,dueDay}){
  must(dueDay&&/^\d{4}-\d{2}-\d{2}$/.test(dueDay),"date");
  const d=dueDay.replace(/-/g,""),now=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+Z$/,"Z");
  const lines=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Adorim Community Fund//Hub//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH","BEGIN:VEVENT",
    `UID:${uid}@adorim-hub`,`DTSTAMP:${now}`,`DTSTART:${d}T093000`,`DTEND:${d}T095000`,
    `SUMMARY:${icsEscape(summary)}`,`DESCRIPTION:${icsEscape(description)}`,
    "BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${icsEscape(summary)}`,"TRIGGER:-PT30M","END:VALARM","END:VEVENT","END:VCALENDAR"];
  const url=URL.createObjectURL(new Blob([lines.join("\r\n")+"\r\n"],{type:"text/calendar;charset=utf-8"}));
  const link=document.createElement("a");link.href=url;link.download=`adorim-${dueDay}.ics`;document.body.append(link);link.click();link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  notify(t("Calendar reminder downloaded — open it to save to your phone calendar.","התזכורת ליומן הורדה — פתחו את הקובץ כדי לשמור ביומן הטלפון."));
}

function openPickThreeStep1(){

    const items=[];
    for(let i=0;i<WIZARD_PROMPTS.length;i++){

    ${field(t("Their nickname","הכינוי שלהם"),input("alias","",`maxlength="60" required autocomplete="off" placeholder="${t("e.g. Circle A","למשל: מעגל א׳")}"`))}
    ${field(t("Which project might interest them?","איזה מיזם עשוי לעניין אותם?"),select("project",`<option value="">${t("Choose a project","בחירת מיזם")}</option>`+opts(S.projects.map(p=>p.id),projectName,""),"required"))}
    <details class="quick-extra"><summary>${t("Circle and reminder","מעגל ותזכורת")}</summary><div class="form-grid">${field(t("Relationship","הקשר ביניכם"),select("circle",opts(["first","second"],k=>l(CIRCLE[k]),"first")))}${field(t("First reminder","תזכורת ראשונה"),input("due",localDay(3),'type="date" required'))}</div></details>
    ${savebar(t("Add to my circle","הוספה למעגל שלי"))}</form>`,peopleLabel());
  $("#quick-add [name=alias]").focus();
  formHandler($("#quick-add"),async d=>{
    const before=new Set(mine().map(a=>a.id));
    const p={...blankLead(S.user.id),alias:d.get("alias").trim(),project:d.get("project"),circle:d.get("circle"),due:d.get("due"),market:"other",country:"",
      next:d.get("circle")==="second"?t("Ask for a warm introduction","לבקש חיבור אישי"):t("Invite them to a short conversation","להזמין לשיחה אישית קצרה")};
    validateLead(p,null,S);await change("lead",p);circleFocus=mine().find(a=>!before.has(a.id)&&a.alias===p.alias)?.id||"";circleQuery="";saved();

const UPDATES={
  contact:["I reached out","יצרתי קשר"],met:["We met","נפגשנו"],help:["Ask the team for help","בקשת עזרה מהצוות"],
  intro:["I made the introduction","ערכתי את ההיכרות"],finished:["My follow-up is done","סיימתי את המעקב"],later:["Set a reminder","קביעת תזכורת"]
};
const UPDATE_ICONS={contact:"outreach",met:"team",intro:"link",finished:"check",help:"hand",later:"calendar"};
function updateOptions(a){
  const open=["identified","contacted","meeting"].includes(a.stage);
  return [...(open?["contact",a.circle==="second"?"intro":"met"]:[]),...(["received","referred"].includes(a.stage)&&a.next?["finished"]:[]),
    ...(!a.help&&a.stage!=="declined"?["help"]:[]),...(a.stage!=="declined"?["later"]:[])];
}
function quickDetails(id){const a=S.leads.find(p=>p.id===id);must(a,"missing");return a}
actions["person-update"]=id=>{
  const a=clone(quickDetails(id)),options=updateOptions(a),h=handoffLabel(a);
  modal(a.alias,`<div class="quick-context"><span class="shape-icon lavender">${icon(PROJECT[a.project].icon)}</span><div><strong>${esc(projectName(a.project))}</strong><div class="tags">${personChips(a)}</div></div></div>
    ${options.length?`<form id="quick-update"><fieldset class="update-choices"><legend>${t("What’s the update?","מה השתנה?")}</legend>${options.map(k=>`<label class="choice-tile"><input type="radio" name="outcome" value="${k}" required><span>${icon(UPDATE_ICONS[k])}${esc(l(UPDATES[k]))}</span></label>`).join("")}</fieldset>
    <div id="quick-follow" class="stack" hidden>${field(t("Next step","הצעד הבא"),input("next","","maxlength='160'"))}${field(t("Remind me on","להזכיר לי בתאריך"),input("due",a.due||localDay(3),"type='date'"))}</div>
    <div id="help-hint" hidden>${note(STANDALONE?t("Passing this lead prepares a ready-to-send WhatsApp or text summary for the campaign coordinator. Your private list stays on your phone.","העברת הפנייה תכין עבורך הודעת וואטסאפ או טקסט מוכנה לרכז הגיוס. הרשימה הפרטית נשארת רק במכשיר שלך."):t("This creates one task for the team. You’ll see here when it is picked up or completed.","הבקשה תיצור משימה אחת לצוות. כאן תוכלו לראות כשהטיפול יתחיל או יסתיים."))}${field(t("What do you need help with? (optional)","במה דרושה עזרה? (לא חובה)"),input("request","","maxlength='160'"))}</div>
    ${savebar(t("Save update","שמירת העדכון"))}</form>`:note(t("No follow-up is scheduled after a decline.","לא נקבעת פנייה נוספת לאחר סירוב."))}
    ${STANDALONE&&a.help?`<div class="actions top-gap">${act("share-handoff",t("Send handoff to team via WhatsApp / copy","שליחת הפנייה לצוות בוואטסאפ / העתקה"),{id,cls:"primary small",icon:"outreach"})}</div>`:""}
    <details class="quick-extra"><summary>${t("More options","אפשרויות נוספות")}</summary><div class="actions">${a.due&&a.stage!=="declined"?act("person-ics",t("Add reminder to calendar","הוספת תזכורת ליומן"),{id,cls:"small",icon:"calendar"}):""}${act("lead-edit",t("Full record, gifts & settings","רשומה מלאה, תרומות והגדרות"),{id,cls:"small"})}${a.stage!=="declined"&&!a.pledged?act("person-decline",t("Record a decline","תיעוד סירוב"),{id,cls:"bare small"}):""}</div></details>`,h||peopleLabel());
  const form=$("#quick-update");if(!form)return;
  form.addEventListener("change",e=>{
    if(e.target.name!=="outcome")return;
    const k=e.target.value,needsDate=k!=="help"&&k!=="finished";
    $("#quick-follow").hidden=!needsDate;$("#help-hint").hidden=k!=="help";
    form.elements.next.required=needsDate;form.elements.due.required=needsDate;
    form.elements.next.value=k==="met"?t("Agree the next step from our meeting","לסכם את הצעד הבא מהפגישה"):k==="contact"?t("Arrange a short conversation","לתאם שיחה קצרה"):k==="intro"?t("Check that both people connected","לוודא ששני הצדדים יצרו קשר"):a.next||t("Follow up as agreed","לחזור במועד שסוכם");
    form.elements.due.value=k==="later"?localDay(7):localDay(k==="met"?1:3);
  });
  formHandler(form,async d=>{
    const k=d.get("outcome");must(options.includes(k));
    const p={...a};
    if(k==="help"){p.help=true;if(d.get("request").trim()){p.next=d.get("request").trim();p.due=p.due||localDay(2)}}
    else if(k==="finished"){p.next="";p.due=""}
    else {p.next=d.get("next").trim();p.due=d.get("due");
      if(k==="contact"&&p.stage==="identified")p.stage="contacted";if(k==="met"){p.stage="meeting";p.meetingHeld=true}if(k==="intro")p.stage="referred"}
    validateLead(p,a,S);await change("lead",p);circleFocus="";
    if(k==="help"&&STANDALONE){render();openHandoffShare(p,d.get("request").trim())}
    else{saved();if(k==="help")notify(t("Sent to the team’s task board.","הבקשה נשלחה ללוח המשימות של הצוות."))}
  });
};
actions["person-decline"]=id=>{
  const a=clone(quickDetails(id));must(!a.pledged,"finance");
  modal(t("End this approach?","לסיים את הפנייה?"),`<form id="quick-decline"><p>${t("This clears the reminder and closes any open handoff. The record stays in your circle.","התזכורת תוסר ובקשת עזרה פתוחה תיסגר. הרשומה תישאר במעגל שלך.")}</p>${savebar(t("Record decline","תיעוד סירוב"))}</form>`);
  formHandler($("#quick-decline"),async()=>{await change("lead",{...a,stage:"declined",next:"",due:"",help:false});saved()});
};
views.resources=()=>`${deskRibbon(isManager())}${titleBlock(t("Adorim field guide","המדריך של אדורים"),t("What you need, when you need it.","כלים לרגע הנכון."),t("Choose a conversation starter, a project to discuss or a guide to the campaign.","כאן אפשר לבחור נוסח לשיחה, מיזם להצגה או מדריך לגיוס."))}
  <div class="resource-grid">${[["toolkit","01",t("What should I say?","מה כדאי להגיד?"),t("Openings, introductions and thank-yous.","פתיחים, חיבורים והודעות תודה.")],["projects","02",t("What are we funding?","למה מגייסים?"),t("Project briefs, estimates and approved giving routes.","כרטיסי מיזם, אומדנים ומסלולי תרומה מאומתים.")],["playbook","03",t("How does this work?","איך זה עובד?"),t("An eight-week guide for volunteers and coordinators.","מדריך לשמונה שבועות לתושבים ולרכזים.")]].map(([k,n,head,sub],i)=>`<a class="resource-tile theme-${i}" href="#${k}"><div class="resource-glyph">${icon(k)}<b>${n}</b></div><h2>${esc(head)}</h2><p>${esc(sub)}</p><span>${esc(l(NAV[k]))}${icon("arrow","sm")}</span></a>`).join("")}</div>
  <div class="download-strip">${icon("file")}<div><strong>${t("Bilingual donor brief","תקציר דו־לשוני לתורם")}</strong><small>${t("A shareable overview without contact details.","סקירה לשיתוף ללא פרטי קשר.")}</small></div>${act("brief",t("Print or save PDF","הדפסה או שמירה כ־PDF"),{icon:"print",cls:"small"})}</div>`;

</script>
  <script>
"use strict";
let boardUI={filter:"all",priority:"",owner:"",query:"",layout:"board",lane:"todo"},dragging=null;
const taskFor=id=>{must(isManager(),"forbidden");const w=S.tasks.find(x=>x.id===id);must(w,"missing");return w};
const taskLead=w=>w.leadId?S.leads.find(p=>p.id===w.leadId):null;
const workTitle=w=>displayEntry(w.id,w.title)||t("Help with ","עזרה בקשר עם ")+(taskLead(w)?.alias||t("a conversation","אחד התורמים"));
const workOwner=w=>w.assignee?ownerName(w.assignee):t("Unassigned","ללא אחראי");
const lanes=["todo","doing","done"];
const filters={open:["Open tasks","משימות פתוחות"],mine:["My open tasks","פתוחות שלי"],unassigned:["Unassigned","ללא אחראי"],overdue:["Overdue","באיחור"]};
const isLate=w=>w.status!=="done"&&w.due<localDay();
function inScope(w,k){return k==="all"||(w.status!=="done"&&(k==="open"|| (k==="mine"?w.assignee===S.user.id:k==="unassigned"?!w.assignee:isLate(w))))}
function matchWork(){
  const q=boardUI.query.trim().toLocaleLowerCase();
  return S.tasks.filter(w=>inScope(w,boardUI.filter)&&(!boardUI.priority||w.priority===boardUI.priority)
    &&(boardUI.owner===""||w.assignee===Number(boardUI.owner))&&(!q||[workTitle(w),taskLead(w)?.alias||"",workOwner(w)].some(v=>v.toLocaleLowerCase().includes(q))))
    .sort((a,b)=>a.status==="done"&&b.status==="done"?b.completed.localeCompare(a.completed):
      Number(isLate(b))-Number(isLate(a))||["high","normal","low"].indexOf(a.priority)-["high","normal","low"].indexOf(b.priority)||a.due.localeCompare(b.due)||workTitle(a).localeCompare(workTitle(b)));
}
function boardMeter(){
  const counts=lanes.map(k=>S.tasks.filter(w=>w.status===k).length),total=S.tasks.length;
  let start=0;
  const arcs=counts.map((n,i)=>{const len=total?n/total*100:0,offset=start;start+=len;
    return n?`<circle class="arc-${lanes[i]}" cx="60" cy="60" r="48" pathLength="100" stroke-dasharray="${Math.max(.1,len-(len<100?1.8:0))} 100" stroke-dashoffset="${-offset}"/>`:""}).join("");
  return `<div class="board-meter"><svg viewBox="0 0 120 120" aria-hidden="true"><g fill="none" stroke-width="9" transform="rotate(-90 60 60)"><circle cx="60" cy="60" r="48" stroke="#48467d"/>${arcs}</g><text x="60" y="65" text-anchor="middle" fill="white" font-size="29" font-weight="700">${counts[0]+counts[1]}</text><text x="60" y="81" text-anchor="middle" fill="#dbd6fa" font-size="10">${t("OPEN","פתוחות")}</text></svg><div class="meter-legend">${lanes.map((k,i)=>`<span><i class="swatch ${k}"></i>${esc(l(taskState[k]))}<b>${counts[i]}</b></span>`).join("")}</div></div>`;
}
function workCard(w){
  const a=taskLead(w),scope=a?t("Resident handoff","בקשת עזרה"):t("Team task","משימת צוות");
  return `<article class="work-card lane-${w.status}" draggable="true" data-work="${esc(w.id)}"><div class="work-card-top"><span class="work-kind">${icon(a?"outreach":"flag","sm")}${scope}</span><span class="priority pr-${w.priority}">${esc(l(taskPriority[w.priority]))}</span></div>
    <button class="task-title" type="button" data-act="task-edit" data-id="${esc(w.id)}">${esc(workTitle(w))}</button>
    ${a?`<p class="work-excerpt"><bdi>${esc(a.alias)}</bdi> · ${esc(projectName(a.project))}${a.next?" · "+esc(displayEntry(a.id,a.next)):""}</p>`:w.notes?`<p class="work-excerpt">${esc(w.notes)}</p>`:""}
    <div class="work-meta"><span class="owner-dot${w.assignee?" assigned":""}">${w.assignee?esc(initials(workOwner(w))):icon("person","sm")}</span><span>${esc(workOwner(w))}</span><span class="work-date ${isLate(w)?"late":""}">${icon(w.status==="done"?"check":"calendar","sm")}${esc((isLate(w)?t("Late · ","באיחור · "):"")+shortDate(w.status==="done"?w.completed.slice(0,10):w.due))}</span></div>
    <div class="work-footer">${act(w.status==="todo"?"task-start":w.status==="doing"?"task-done":"task-reopen",w.status==="todo"?(w.assignee?t("Start","התחלה"):t("Take task","לקחת לטיפולי")):w.status==="doing"?t("Mark done","סימון כהושלם"):t("Reopen","פתיחה מחדש"),{id:w.id,cls:"task-step",icon:w.status==="doing"?"check":w.status==="done"?"refresh":"arrow"})}
    ${mini("task-edit",t("Edit task: ","עריכת משימה: ")+workTitle(w),"pen",w.id)}</div></article>`;
}
function laneButton(k,n){return `<button type="button" data-act="board-lane" data-id="${k}" aria-pressed="${boardUI.lane===k}">${esc(l(taskState[k]))}<b>${n}</b></button>`}
function workResults(){
  const list=matchWork(),groups=lanes.map(k=>list.filter(w=>w.status===k)),filtered=!!(boardUI.filter!=="all"||boardUI.query||boardUI.priority||boardUI.owner!=="");
  const count=`<div class="board-count" aria-live="polite">${t("Showing","מוצגות")} ${list.length} / ${S.tasks.length} ${t("tasks","משימות")}${filtered?act("board-clear",t("Clear filters","ניקוי מסננים"),{cls:"bare small"}):""}</div>`;
  if(!list.length)return count+empty(filtered?t("No tasks match these filters.","אין משימות שמתאימות למסננים."):t("A clear board.","הלוח פנוי."),filtered?t("Clear a filter to see more work.","הסירו מסנן כדי לראות משימות נוספות."):t("Add the first team task. Resident requests for help will also appear here.","הוסיפו משימת צוות ראשונה. גם בקשות העזרה של התושבים יופיעו כאן."),filtered?act("board-clear",t("Show all tasks","הצגת כל המשימות")):act("task-new",t("New task","משימה חדשה"),{cls:"primary",icon:"plus"}));
  if(boardUI.layout==="list")return `${count}<div class="work-list">${lanes.map((k,i)=>groups[i].length?`<section><h3 class="list-lane"><i class="swatch ${k}"></i>${esc(l(taskState[k]))} <b>${groups[i].length}</b></h3>${groups[i].map(workCard).join("")}</section>`:"").join("")}</div>`;
  return `${count}<div class="mobile-lanes">${lanes.map((k,i)=>laneButton(k,groups[i].length)).join("")}</div><div class="work-board">${lanes.map((k,i)=>`<section class="work-lane ${boardUI.lane===k?"picked":""}" data-lane="${k}" aria-label="${esc(l(taskState[k]))}"><h3><span><i class="swatch ${k}"></i>${esc(l(taskState[k]))}</span><b>${groups[i].length}</b></h3><div class="lane-cards">${groups[i].map(workCard).join("")||`<div class="lane-empty">${icon("circle","sm")}<span>${t("No tasks here","אין כאן משימות")}</span></div>`}</div></section>`).join("")}</div>`;
}
function boardView(){
  must(isManager(),"forbidden");
  return `${deskRibbon(true)}<section class="board-hero"><div>${eyebrow(t("Adorim · team operations","אדורים · תפעול הצוות"))}<h1>${esc(boardLabel())}</h1><p>${t("Give every open task an owner and a next move.","לכל משימה פתוחה קובעים אחראי וצעד הבא.")}</p><div class="actions">${act("task-new",t("New task","משימה חדשה"),{cls:"lime",icon:"plus"})}${act("go-pipeline",t("Resident follow-ups","מעקב אחר פניות"),{cls:"on-dark",arrow:true})}</div></div>${boardMeter()}</section>
  <div class="metric-strip">${Object.keys(filters).map((k,i)=>`<button type="button" class="metric-button metric-${k}" data-act="board-filter" data-id="${k}" aria-pressed="${k===boardUI.filter}"><span class="metric-symbol">${icon(["board","person","team","clock"][i])}</span><span><b>${S.tasks.filter(w=>inScope(w,k)).length}</b><small>${esc(l(filters[k]))}</small></span></button>`).join("")}</div>
  <section class="board-section"><div class="board-heading"><div>${eyebrow(t("Work queue","תור העבודה"))}<h2>${t("Team tasks","משימות הצוות")}</h2></div><div class="layout-toggle">${["board","list"].map(k=>`<button type="button" data-act="board-layout" data-id="${k}" aria-pressed="${k===boardUI.layout}">${icon(k,"sm")}${k==="board"?t("Board","לוח"):t("List","רשימה")}</button>`).join("")}</div></div>
  <div class="board-tools">${field(t("Find task","חיפוש משימה"),input("query",boardUI.query,`id="work-query" type="search" placeholder="${t("Title or nickname","כותרת או כינוי")}"`))}${field(t("Priority","עדיפות"),select("priority",`<option value="">${t("Any priority","כל העדיפויות")}</option>`+opts(Object.keys(taskPriority),k=>l(taskPriority[k]),boardUI.priority),'id="work-priority"'))}
  ${field(t("Team owner","אחראי/ת בצוות"),select("owner",`<option value="">${t("Everyone","כולם")}</option>`+opts(["0",...S.members.filter(m=>m.role==="manager").map(m=>String(m.id))],k=>k==="0"?l(filters.unassigned):ownerName(Number(k)),boardUI.owner),'id="work-owner"'))}</div>
  <div id="work-results">${workResults()}</div></section>`;
}
function resetBoardFilters(){Object.assign(boardUI,{filter:"all",priority:"",owner:"",query:""})}
function chooseMatchingLane(){const list=matchWork();if(list.length&&!list.some(w=>w.status===boardUI.lane))boardUI.lane=list[0].status}
function refocusBoard(key,id){(Array.from(document.querySelectorAll("[data-act]")).find(e=>e.dataset.act===key&&e.dataset.id===id&&e.offsetWidth)||$("#main"))?.focus({preventScroll:true})}
actions["board-filter"]=id=>{const toggleOff=boardUI.filter===id;resetBoardFilters();boardUI.filter=toggleOff?"all":id;chooseMatchingLane();render();refocusBoard("board-filter",id)};
actions["board-clear"]=()=>{resetBoardFilters();render();$("#work-query")?.focus({preventScroll:true})};
actions["board-layout"]=id=>{boardUI.layout=id;render();refocusBoard("board-layout",id)};
actions["board-lane"]=id=>{boardUI.lane=id;$("#work-results").innerHTML=workResults();refocusBoard("board-lane",id)};
document.addEventListener("input",e=>{if(e.target.closest(".board-tools")){boardUI[e.target.name]=e.target.value;chooseMatchingLane();$("#work-results").innerHTML=workResults()}});
actions["go-pipeline"]=()=>{teamTab="pipeline";if(location.hash==="#team")render();else location.hash="team"};
function taskEditor(id=""){
  must(isManager(),"forbidden");const w=id?clone(taskFor(id)):blankTask(),a=taskLead(w);
  const owners=[0,...S.members.filter(m=>m.active&&m.role==="manager").map(m=>m.id)];
  modal(id?t("Edit task","עריכת משימה"):t("New task","משימה חדשה"),`<form id="work-form">${a?`<div class="linked-person"><span class="shape-icon mint">${icon("outreach")}</span><div><span class="subtle-label">${t("Linked conversation","השיחה המקושרת")}</span><strong><bdi>${esc(a.alias)}</bdi> · ${esc(projectName(a.project))}</strong></div>${mini("lead-edit",t("Open person’s full record","פתיחת הרשומה המלאה"),"arrow",a.id)}</div>`:""}
    ${field(t("Task title","כותרת המשימה"),input("title",w.title,`maxlength="100" ${a?`placeholder="${esc(workTitle(w))}"`:"required"}`))}
    <div class="form-grid">${field(t("Team owner","אחראי/ת בצוות"),select("assignee",opts(owners,k=>k?ownerName(k):l(filters.unassigned),w.assignee)))}${field(t("Due date","תאריך יעד"),input("due",w.due,'type="date" required'))}
    ${field(t("Priority","עדיפות"),select("priority",opts(Object.keys(taskPriority),k=>l(taskPriority[k]),w.priority)))}${field(t("Status","מצב"),select("status",opts(lanes,k=>l(taskState[k]),w.status)))}</div>
    ${field(t("Team-only notes","הערות לצוות בלבד"),area("notes",w.notes,500),t("No donor contact details or sensitive information.","ללא פרטי קשר של תורמים או מידע רגיש."))}
    ${a?note(t("Finishing this task closes the help request, not the relationship or any gift. Reopening it requests follow-up again.","השלמת המשימה סוגרת את בקשת העזרה בלבד, לא את הקשר או התרומה. פתיחה מחדש מחזירה את הבקשה לטיפול.")):""}
    ${id&&w.due?`<div class="actions">${act("task-ics",t("Add task due date to calendar","הוספת מועד המשימה ליומן"),{id,cls:"small",icon:"calendar"})}</div>`:""}
    ${savebar(id?t("Save task","שמירת המשימה"):t("Create task","יצירת המשימה"))}</form>`,boardLabel());
  const f=$("#work-form");f.elements.title.focus();f.elements.status.addEventListener("change",()=>{if(f.elements.status.value==="doing"&&f.elements.assignee.value==="0")f.elements.assignee.value=String(S.user.id)});
  formHandler(f,async d=>{
    const updated={...w,title:d.get("title").trim(),notes:d.get("notes").trim(),due:d.get("due"),priority:d.get("priority"),status:d.get("status"),assignee:Number(d.get("assignee"))};
    must(updated.status!=="doing"||updated.assignee,"taskOwner");
    await change("task",updated);boardUI.lane=updated.status;if(!id)resetBoardFilters();saved();
  });
}
actions["task-new"]=()=>taskEditor();actions["task-edit"]=id=>taskEditor(id);
actions["task-ics"]=id=>{
  const w=taskFor(id);must(w.due,"date");
  downloadICS({uid:"adorim-task-"+w.id,summary:t(`Adorim task · ${workTitle(w)}`,`משימת אדורים · ${workTitle(w)}`),
    description:`${t("Owner","אחראי/ת")}: ${workOwner(w)}\n${t("Priority","עדיפות")}: ${l(taskPriority[w.priority])}${w.notes?"\n"+w.notes:""}`,dueDay:w.due});
};
let boardSaving=false;
async function moveTask(w,status){
  if(w.status===status)return;
  must(!boardSaving,"taskBusy");boardSaving=true;
  try{
    await change("task",{...w,status,assignee:status==="doing"&&!w.assignee?S.user.id:w.assignee});
    boardUI.lane=status;render();notify(t("Task moved to ","המשימה הועברה למצב: ")+l(taskState[status]));
    refocusBoard("task-edit",w.id);
  }finally{boardSaving=false}
}
actions["task-start"]=id=>moveTask(taskFor(id),"doing");
actions["task-done"]=id=>moveTask(taskFor(id),"done");
actions["task-reopen"]=id=>moveTask(taskFor(id),"todo");
actions["track-followup"]=async id=>{
  must(isManager(),"forbidden");const a=quickDetails(id);
  if(!a.help)await change("lead",{...a,help:true});
  const w=S.tasks.find(x=>x.leadId===id);must(w,"missing");render();taskEditor(w.id);
};
document.addEventListener("dragstart",e=>{
  const card=e.target.closest(".work-board [data-work]");if(!card||!isManager())return;
  dragging=clone(taskFor(card.dataset.work));e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain","adorim-work");
  card.classList.add("dragging");
});
function clearDrag(){dragging=null;document.querySelectorAll(".dragging,.drop-ready").forEach(el=>el.classList.remove("dragging","drop-ready"))}
document.addEventListener("dragover",e=>{
  const lane=e.target.closest("[data-lane]");if(!lane||!dragging)return;e.preventDefault();e.dataTransfer.dropEffect="move";
  document.querySelectorAll(".drop-ready").forEach(el=>{if(el!==lane)el.classList.remove("drop-ready")});lane.classList.add("drop-ready");
});
document.addEventListener("drop",async e=>{
  const lane=e.target.closest("[data-lane]");if(!lane||!dragging)return;e.preventDefault();
  const w=dragging;clearDrag();try{await moveTask(w,lane.dataset.lane)}catch(err){notify(errors(err),true)}
});
document.addEventListener("dragend",clearDrag);

let checkingBoard=false,syncWarning=false;
function readyForSync(){return !practice&&S?.user&&["desk","outreach"].includes(activeRoute)&&!document.hidden&&!writing&&!dragging&&!boardSaving&&!$("#dialog").open&&!document.activeElement?.matches("input,textarea,select")}
async function syncVisibleWork(){
  if(checkingBoard||!readyForSync())return;
  checkingBoard=true;const snapshot=S,epoch=stateEpoch;
  try{
    const updated=await api("state");
    if(!readyForSync()||snapshot!==S||epoch!==stateEpoch)return;
    syncWarning=false;
    if(!updated.user||updated.user.id!==S.user.id){clearPrivateView();S=updated;loadProblem=updated.user?"":"expired";render();return}
    if(JSON.stringify(updated)!==JSON.stringify(S)){
      const current=document.activeElement,action=current?.dataset.act,id=current?.dataset.id;
      S=updated;render();if(action)refocusBoard(action,id);
    }
  }catch(err){
    if(!syncWarning){notify(t("Could not refresh shared work. Use Refresh to retry.","רענון העבודה המשותפת נכשל. נסו שוב באמצעות כפתור הרענון."),true);syncWarning=true}
  }finally{checkingBoard=false}
}
if(!PORTABLE){window.addEventListener("focus",syncVisibleWork);document.addEventListener("visibilitychange",syncVisibleWork);setInterval(syncVisibleWork,45000)}

</script>
</body>
</html>
